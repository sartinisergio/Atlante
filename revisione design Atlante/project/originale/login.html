<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8" />
<title>Atlante — accesso</title>
<link rel="stylesheet" href="css/atlante-theme.css" />
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 420px; margin: 80px auto; padding: 0 20px; color: var(--ink); background: var(--paper); }
  h1 { font-family: Georgia, 'Times New Roman', serif; font-size: 21px; }
  input { width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; font-size: 15px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); }
  input:focus { outline: none; border-color: var(--accent); }
  button { padding: 10px 16px; font-size: 15px; cursor: pointer; background: var(--accent); color: #fff; border: none; border-radius: 6px; }
  button:hover { background: var(--accent-strong); }
  #stato { margin-top: 20px; padding: 12px; border-radius: 6px; font-size: 14px; white-space: pre-wrap; }
  .ok { background: var(--green-tint); }
  .attesa { background: var(--amber-tint); }
  .errore { background: var(--brick-tint); }
</style>
</head>
<body>

<h1>Atlante — accesso</h1>
<p>Login con link via email (nessuna password).</p>

<input id="email" type="email" placeholder="la tua email" value="sartinisergio@gmail.com" />
<button id="invia">Invia link di accesso</button>

<div id="stato"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
  const SUPABASE_URL = 'https://qnozhdoyczxgxqvehuwc.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_ADz9us9Mktk3nc7lixni2A_NAnZ5LG-';
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const stato = document.getElementById('stato');
  function mostra(classe, testo) {
    stato.className = classe;
    stato.textContent = testo;
  }

  document.getElementById('invia').addEventListener('click', async () => {
    const email = document.getElementById('email').value.trim();
    if (!email) return;
    mostra('attesa', 'Invio in corso...');
    const { error } = await supabaseClient.auth.signInWithOtp({
      email,
      options: { emailRedirectTo: window.location.href },
    });
    if (error) mostra('errore', 'Errore: ' + error.message);
    else mostra('attesa', `Controlla la tua email (${email}) e clicca il link di accesso.`);
  });

  async function verificaSessione() {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) return;

    const { data: profilo } = await supabaseClient
      .from('profili')
      .select('id')
      .eq('id', session.user.id)
      .maybeSingle();

    if (profilo) {
      mostra('ok', `Connesso come ${session.user.email} — apertura menu...`);
      window.location.href = 'home.html';
    } else {
      mostra('attesa', `Connesso come ${session.user.email}, ma nessun profilo collegato ancora. Contatta l'amministratore.`);
    }
  }

  supabaseClient.auth.onAuthStateChange((_event, _session) => verificaSessione());
  verificaSessione();
</script>
</body>
</html>
